.row{display:flex;justify-content:space-between;align-items:center;position:relative}
.logo{display:flex;align-items:center;gap:8px}
.logo-mark{width:36px;height:36px;border-radius:10px;background:var(--gold);color:#000;display:flex;align-items:center;justify-content:center;font-family:'Syne';font-weight:800;font-size:16px}
.logo-text{font-family:'Syne';font-weight:700;font-size:13px;letter-spacing:.18em;color:var(--muted)}
.badge{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 12px}
.dot{width:8px;height:8px;border-radius:999px;background:#34D399;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.5}}
.badge span{font-size:11px;font-weight:600;letter-spacing:.05em;color:rgba(255,255,255,.8)}
.title{margin-top:32px;line-height:.9;letter-spacing:-.04em}
.title span{display:block;font-weight:800;font-size:54px;font-family:'Syne'}
.title span:last-child{color:var(--gold);margin-top:-4px}
.addr{margin-top:16px;display:flex;gap:12px;align-items:flex-start}
.addr .line{width:32px;height:1px;background:var(--gold);margin-top:12px;flex-shrink:0}
.addr p{font-size:15px;line-height:1.35;color:rgba(255,255,255,.7);font-weight:500}
.addr p b{color:#fff;font-weight:700}
.pills{margin-top:24px;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border-gold);background:var(--gold-soft);border-radius:14px;padding:10px 14px}
.pill strong{font-family:'Syne';font-weight:800;font-size:14px;color:var(--gold-2)}
.pill span{font-size:12px;font-weight:600;color:rgba(255,255,255,.8)}
.mode{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-size:12px;font-weight:600;color:rgba(255,255,255,.75)}
.mode small{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);padding:2px 8px;border-radius:999px;font-size:11px;color:rgba(255,255,255,.5)}
.divider{height:1px;background:linear-gradient(to right, transparent, var(--border), transparent);margin:0 20px}
.section{padding:28px 20px 8px}
.section h2{font-size:22px;font-weight:700;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:end}
.section h2 small{font-family:'Manrope';font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:600}
.prices{margin-top:16px;display:grid;gap:10px}
.price{width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:.2s}
.price:hover{border-color:#2F2F2F;background:var(--surface-2)}
.price.active{background:var(--gold-soft);border-color:var(--gold);box-shadow:0 0 0 1px var(--gold), 0 8px 24px rgba(201,168,106,.15)}
.price-left{display:flex;align-items:center;gap:14px}
.num{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Syne';font-weight:700;font-size:13px;background:#1E1E1E;color:rgba(255,255,255,.6)}
.price.active .num{background:var(--gold);color:#000}
.price-main strong{display:block;font-size:15px;font-weight:600;line-height:1}
.price-main small{margin-top:6px;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}
.price-main small i{font-style:normal;background:rgba(255,255,255,.06);border-radius:999px;padding:2px 8px;font-size:10px;font-weight:600}
.tag{margin-left:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:2px 8px;font-size:9px;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.5);text-transform:uppercase}
.price-right{text-align:right;display:flex;align-items:center;gap:12px}
.price-right b{font-family:'Syne';font-size:17px;font-weight:700}
.price.active .price-right b{color:var(--gold-2)}
.price-right em{font-style:normal;display:block;margin-top:2px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.price.active .price-right em{color:var(--gold)}
.arrow{width:32px;height:32px;border-radius:999px;border:1px solid var(--border);background:#181818;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4)}
.price.active .arrow{background:var(--gold);border-color:var(--gold);color:#000}
.hint{margin-top:16px;background:#151515;border:1px dashed var(--border);border-radius:14px;padding:12px 16px;display:flex;gap:10px}
.hint div:first-child{width:28px;height:28px;border-radius:999px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hint p{font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.55);font-weight:500}
.booking{margin:32px 20px 0;border:1px solid var(--border);background:var(--surface);border-radius:24px;overflow:hidden;transition:.3s}
.booking.disabled{opacity:.45;pointer-events:none;transform:translateY(8px)}
.booking-head{padding:20px 20px 12px;display:flex;justify-content:space-between;gap:16px}
.booking-head h3{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1}
.booking-head p{margin-top:8px;font-size:12.5px;color:rgba(255,255,255,.5);line-height:1.4}
.dates{padding:0 12px}
.dates-top{display:flex;justify-content:space-between;padding:0 8px;font-size:11px;letter-spacing:.14em;font-weight:700;color:rgba(255,255,255,.4)}
.dates-top span:last-child{color:var(--gold);font-weight:600;letter-spacing:0}
.days{margin-top:12px;display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.day{min-width:84px;border:1px solid var(--border);background:var(--surface-2);border-radius:16px;padding:12px;text-align:left;cursor:pointer;transition:.2s;flex-shrink:0}
.day.active{background:var(--gold);border-color:var(--gold);color:#000;box-shadow:0 8px 20px rgba(201,168,106,.25)}
.day b{display:block;font-size:12px;font-weight:800;letter-spacing:.02em}
.day small{display:block;margin-top:6px;font-size:11px;font-weight:600;opacity:.7}
.day .bar{margin-top:8px;height:4px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden}
.day.active .bar{background:rgba(0,0,0,.15)}
.day .bar i{display:block;height:100%;width:40%;background:rgba(255,255,255,.2);border-radius:999px}
.day.active .bar i{width:100%;background:#000}
.times{margin-top:8px;padding:0 12px 4px}
.times-top{display:flex;justify-content:space-between;padding:0 8px;font-size:11px;letter-spacing:.14em;font-weight:700;color:rgba(255,255,255,.4)}
.times-grid{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.t{border:1px solid var(--border);background:var(--surface-2);border-radius:14px;padding:14px 0;text-align:center;font-size:14px;font-weight:700;cursor:pointer;transition:.2s;color:rgba(255,255,255,.7)}
.t:hover{background:#242424;color:#fff;border-color:#2E2E2E}
.t.active{background:#fff;color:#000;border-color:#fff;box-shadow:0 6px 16px rgba(255,255,255,.15);transform:scale(.98)}
.t:disabled{background:#141414;color:rgba(255,255,255,.15);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.1);cursor:not-allowed}
.total{margin:16px 12px 12px;background:#0F0F0F;border:1px solid var(--border);border-radius:18px;padding:16px;display:flex;justify-content:space-between;gap:12px}
.total small{display:block;font-size:11px;letter-spacing:.12em;font-weight:700;color:rgba(255,255,255,.3)}
.total p{margin-top:6px;font-size:14px;font-weight:600;line-height:1.35}
.total p span{color:rgba(255,255,255,.4)}
.total p em{font-style:normal;color:var(--gold-2);font-size:13px}
footer{padding:32px 20px 24px}
.contacts{border:1px solid var(--border);background:var(--surface);border-radius:22px;padding:20px}
.contacts h4{display:flex;align-items:center;gap:8px;font-family:'Syne';font-size:13px;font-weight:700;letter-spacing:.12em}
.contacts h4 i{width:24px;height:24px;border-radius:999px;background:var(--gold);color:#000;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;font-style:normal}
.contact-grid{margin-top:20px;display:grid;gap:16px}
.c-row{display:flex;gap:12px}
.c-icon{width:36px;height:36px;border-radius:11px;background:#1A1A1A;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.c-row b{font-size:11px;letter-spacing:.12em;color:rgba(255,255,255,.3);font-weight:700}
.c-row p{margin-top:4px;font-size:14px;font-weight:600;line-height:1.35}
.c-links{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.c-links a{background:#1A1A1A;border:1px solid var(--border);border-radius:14px;padding:14px 16px;text-decoration:none;display:block}
.c-links a small{font-size:10px;letter-spacing:.12em;color:rgba(255,255,255,.3);font-weight:700;display:block}
.c-links a strong{margin-top:4px;display:block;color:#fff;font-size:14px;font-weight:700}
.copy{margin-top:24px;text-align:center}
.copy p{font-family:'Syne';font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.2)}
.copy p:last-child{margin-top:8px;letter-spacing:0;color:rgba(255,255,255,.2);font-family:'Manrope'}
.sticky{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;z-index:30;border-top:1px solid var(--border);background:rgba(10,10,10,.95);backdrop-filter:blur(16px);padding:16px 20px}
.sticky-inner{display:flex;align-items:center;gap:12px}
.sticky-text{flex:1;min-width:0}
.sticky-text small{display:block;font-size:11px;letter-spacing:.12em;font-weight:700;color:rgba(255,255,255,.3);line-height:1}
.sticky-text span{display:block;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:600;color:rgba(255,255,255,.7)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;height:52px;padding:0 20px;font-size:14px;font-weight:700;text-decoration:none;transition:.2s;flex-shrink:0}
.btn:disabled,.btn.disabled{background:#1C1C1C;border:1px solid var(--border);color:rgba(255,255,255,.25);cursor:not-allowed}
.btn.active{background:var(--wa);color:#000;box-shadow:0 8px 24px rgba(34,197,94,.25)}
.btn.active:hover{background:var(--wa-dark);color:#fff}
.progress{margin-top:12px;display:flex;gap:6px}
.progress i{display:block;height:4px;flex:1;border-radius:999px;background:rgba(255,255,255,.1);transition:.2s}
.progress i.on{background:var(--gold)}
.progress i.on:last-child{background:var(--wa)}
</style>
</head>
<body>

<script>
const SERVICES = [
  {id:1,name:"Мужская стрижка",price:5000,tag:"топ"},
  {id:2,name:"Детская стрижка",price:4000},
  {id:3,name:"Стрижка + борода",price:7000,tag:"комплекс"},
  {id:4,name:"Оформление бороды",price:3000},
  {id:5,name:"Чистка лица",price:3000},
  {id:6,name:"Отец и сын",price:8000,tag:"семейный"},
  {id:7,name:"Тонировка волос",price:3000},
  {id:8,name:"Депиляция воском",price:1500},
  {id:9,name:"Оконтовка",price:2500},
  {id:10,name:"Мойка / укладка",price:2000}
];
const WEEK_SHORT=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const MONTH_SHORT=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const MONTH_FULL=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const WEEK_FULL=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
let selectedService=null, selectedDateIdx=0, selectedTime=null;
let days=[];
function buildDays(){
  const now=new Date(); days=[];
  for(let i=0;i<7;i++){const d=new Date(); d.setDate(now.getDate()+i); days.push({date:d,labelMain:i===0?"Сегодня":i===1?"Завтра":WEEK_SHORT[d.getDay()],labelSub:d.getDate()+" "+MONTH_SHORT[d.getMonth()],labelFull:d.getDate()+" "+MONTH_FULL[d.getMonth()],weekdayFull:WEEK_FULL[d.getDay()],isToday:i===0});}
}
function renderServices(){
  const c=document.getElementById('prices'); c.innerHTML='';
  SERVICES.forEach(s=>{
    const btn=document.createElement('button'); btn.className='price'+(selectedService&&selectedService.id===s.id?' active':'');
    btn.innerHTML='<div class="price-left"><div class="num">'+String(s.id).padStart(2,'0')+'</div><div class="price-main"><strong>'+s.name+(s.tag?'<span class="tag">'+s.tag+'</span>':'')+'</strong><small><i>30-45 мин</i><span style="width:4px;height:4px;border-radius:999px;background:rgba(255,255,255,.2);display:inline-block"></span><span>мастер</span></small></div></div><div class="price-right"><div><b>'+s.price.toLocaleString('ru-RU')+' ₸</b><em>'+(selectedService&&selectedService.id===s.id?'ВЫБРАНО':'ВЫБРАТЬ')+'</em></div><div class="arrow">'+(selectedService&&selectedService.id===s.id?'✓':'→')+'</div></div>';
    btn.onclick=()=>{selectedService=s;renderServices();document.getElementById('booking').classList.remove('disabled');renderDays();renderTimes();renderTotal();updateSticky();document.getElementById('booking').scrollIntoView({behavior:'smooth',block:'start'});};
    c.appendChild(btn);
  });
}
function renderDays(){
  const c=document.getElementById('days'); c.innerHTML='';
  days.forEach((d,idx)=>{
    const b=document.createElement('button'); b.className='day'+(idx===selectedDateIdx?' active':'');
    b.innerHTML='<b>'+d.labelMain+'</b><small>'+d.labelSub+'</small><div class="bar"><i></i></div>';
    b.onclick=()=>{selectedDateIdx=idx;selectedTime=null;renderDays();renderTimes();renderTotal();updateSticky();};
    c.appendChild(b);
  });
}
function renderTimes(){
  const grid=document.getElementById('times'); const label=document.getElementById('dayLabel'); const day=days[selectedDateIdx];
  if(day) label.textContent=day.weekdayFull+', '+day.labelFull+' • 9:00–20:00';
  const now=new Date(); const isToday=day&&day.isToday; const currentHour=now.getHours();
  const available=isToday?Array.from({length:11},(_,i)=>9+i).filter(h=>h>currentHour):Array.from({length:11},(_,i)=>9+i);
  grid.innerHTML='';
  if(available.length===0){grid.innerHTML='<div style="grid-column:span 3;background:#171717;border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center"><p style="font-size:13px;font-weight:600;color:rgba(255,255,255,.6)">На сегодня слотов больше нет</p><p style="margin-top:4px;font-size:11px;color:rgba(255,255,255,.35)">Выбери завтра — там всё свободно</p></div>'; return;}
  for(let h=9;h<=19;h++){
    const btn=document.createElement('button'); const timeStr=h+':00'; const enabled=available.includes(h);
    btn.className='t'+(selectedTime===timeStr?' active':''); btn.textContent=timeStr; btn.disabled=!enabled;
    btn.onclick=()=>{selectedTime=timeStr;renderTimes();renderTotal();updateSticky();};
    grid.appendChild(btn);
  }
}
function renderTotal(){
  const el=document.getElementById('total');
  if(!selectedService){el.textContent='Выбери услугу выше'; return;}
  if(!days[selectedDateIdx]||!selectedTime){el.innerHTML=selectedService.name+' • '+selectedService.price+' ₸<br><span>выбери дату и время</span>'; return;}
  const d=days[selectedDateIdx]; el.innerHTML=selectedService.name+' • '+selectedService.price+' ₸<br><em>'+d.labelMain+' '+d.labelSub+' в '+selectedTime+'</em>';
}
function updateSticky(){
  const text=document.getElementById('stickyText'); const btn=document.getElementById('waBtn');
  const p1=document.getElementById('p1'), p2=document.getElementById('p2'), p3=document.getElementById('p3');
  p1.className=selectedService?'on':''; p2.className=(selectedService&&days[selectedDateIdx])?'on':''; p3.className=selectedTime?'on':'';
  if(!selectedService){text.textContent='Сначала выбери услугу'; btn.className='btn disabled'; btn.href='#'; return;}
  if(!days[selectedDateIdx]||!selectedTime){text.textContent=selectedService.name+' • выбери время'; btn.className='btn disabled'; btn.href='#'; return;}
  const d=days[selectedDateIdx]; text.textContent=selectedService.name+' • '+d.labelSub+' '+selectedTime;
  const msg='Привет, Orda! Хочу записаться: '+selectedService.name+' на '+d.labelFull+' в '+selectedTime+'. Муканова 81';
  btn.href='https://wa.me/77080085060?text='+encodeURIComponent(msg); btn.className='btn active';
